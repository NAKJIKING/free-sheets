name: omr_core
description: >-
  악보 사진 인식(OMR) 순수 다트 코어 — 줄 검출·정규화, CTC 디코드, 켬/끔 선택,
  가짜 줄 제거, 단선율 경고, 반복 전개·음표 변환, 미디(SMF), WAV 첨부 청크.
  추론(onnxruntime)은 앱이 LineRecognizer 로 주입한다 — 이 패키지는 플랫폼 무관.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  image: ^4.2.0

dev_dependencies:
  test: ^1.25.0
