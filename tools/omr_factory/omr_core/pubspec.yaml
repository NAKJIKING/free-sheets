name: omr_core
description: >-
  악보 사진 인식(OMR) 순수 다트 코어 — 줄 검출·정규화, CTC 디코드, 켬/끔 선택,
  가짜 줄 제거, 화음 경고, 다성부 파트 나누기, 반복 전개·음표 변환, 미디(SMF),
  WAV 첨부 청크, 모델 내려받기(sha256 검증·이어받기).
  추론(onnxruntime)은 앱이 LineRecognizer 로 주입한다 — 이 패키지는 플랫폼 무관.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  image: ^4.2.0

dev_dependencies:
  test: ^1.25.0
